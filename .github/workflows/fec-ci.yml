name: FEC CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与 QUICX FEC 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: 检出 quic-go（FEC 分支）并生成 go.work
        env:
          FORK_QUIC_GO_REF: ${{ vars.FORK_QUIC_GO_REF || 'BanYeHanFeng-dev' }}
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${FORK_QUIC_GO_REF}" https://github.com/BanYeHanFeng/quic-go.git ../quic-go
          cat > go.work <<EOF
          go 1.25.5

          use (
          	.
          	../quic-go
          )
          EOF
          cat go.work
      - name: 构建
        run: go build ./...
      - name: QUICX 测试
        run: go test -count=1 -v ./quicx/...
      - name: 格式检查（仅报告）
        run: |
          files="quicx/fec.go quicx/fec_test.go quicx/client.go quicx/client_packet.go quicx/service.go quicx/protocol.go"
          gofmt -l ${files} || true
          gofmt -d ${files} || true
